<svg xmlns="http://www.w3.org/2000/svg" width="760" height="986" viewBox="0 0 760 986" role="img" aria-labelledby="title description">
<title id="title">TFT·Tauc 분석 흐름</title>
<desc id="description">측정 파일의 스키마, 단위와 조건을 확인합니다. 확인이 필요하면 원래 행과 열을 표시하고 계산을 보류합니다. 확인이 완료되면 이상 위치를 점검하고 TFT 또는 UV–Vis 분석을 진행한 뒤 후보를 선택하고 검토 기록을 남깁니다.</desc>
